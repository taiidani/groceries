[env]
_.file = ".env"
PORT = "3000"
URL = "http://localhost:3000"
DEV = "true"
LOG_LEVEL = "info"

# OIDC_CLIENT_SECRET is deliberately NOT defaulted here since it's a secret;
# set it in your own gitignored .env to exercise the real login flow locally.
OIDC_ISSUER_URL = "https://auth.taiidani.com"
OIDC_CLIENT_ID = "groceries"

REDIS_HOST = "localhost:6379"
DB_TYPE = "postgres"
DATABASE_URL = "postgresql://postgres:root@127.0.0.1:5432/{{vars.filename}}"
GOOSE_DRIVER = "postgres"
GOOSE_DBSTRING = "postgresql://postgres:root@127.0.0.1:5432/{{vars.filename}}"
GOOSE_MIGRATION_DIR = "./internal/db/migrations"

[tools]
go = "1.27"
tuist = "latest"
node = "26.5.0"
sqlc = "latest"
"go:github.com/evanw/esbuild/cmd/esbuild" = "latest"
staticcheck = "latest"
fnox = "latest"
"github:pressly/goose" = "latest"

[vars]
filename = 'groceries'

[tasks.default]
description = "Execute the app in development mode"
depends = ["test", "lint*", "build"]
run = ["./{{vars.filename}}"]

[tasks.build]
description = "Build the server binary"
depends = ["dependencies", "generate:*"]
sources = ["internal/**/*.go", "main.go", "go.*"]
outputs = ["./{{vars.filename}}"]
env.CGO_ENABLED = "0"
run = ["go build -o ./{{vars.filename}}"]

[tasks.dependencies]
description = "Download static assets for building into the binary"
run = [
    "go mod download",
    "curl --fail --silent --location --output internal/server/assets/htmx.dist.js https://unpkg.com/htmx.org@2.0.0",
    "curl --fail --silent --location --output internal/server/assets/htmx-sse.dist.js https://unpkg.com/htmx-ext-sse@2.2.2",
]

[tasks."generate:sqlc"]
description = "Generate SQLC code"
run = ["sqlc generate"]

[tasks.test]
description = "Unit tests"
depends = ["dependencies", "generate:*"]
env.DEV = "false"
env.CGO_ENABLED = 1                                    # Required for -race
run = ["go test -race -covermode=atomic -cover ./..."]

[tasks.seed]
description = "Populate the database with seeds"
depends = []
env.GOOSE_MIGRATION_DIR = "./internal/db/seeds"
run = ["goose --no-versioning up"]

[tasks.lint]
depends = ["dependencies", "generate:*"]
run = ["go vet ./...", "staticcheck ./..."]

[tasks."lint:sqlc"]
run = ["sqlc vet"]

[tasks."test:e2e"]
description = "Run Playwright end-to-end browser tests against a live instance of the app"
depends = ["build"]
run = ["./tests/run.sh"]

[tasks.plugin]
description = "Bundle and deploy the Aisle4 Obsidian plugin to the vault"
sources = ["obsidian/aisle4/src/**", "obsidian/aisle4/manifest.json", "obsidian/aisle4/styles.css"]
outputs = ["obsidian/aisle4/main.js"]
run = """
  set -e
  esbuild obsidian/aisle4/src/main.js \\
    --bundle \\
    --platform=node \\
    --format=cjs \\
    --external:obsidian \\
    --outfile=obsidian/aisle4/main.js
  DEST="$HOME/Documents/merrett and ryan/.obsidian/plugins/aisle4"
  mkdir -p "$DEST"
  cp obsidian/aisle4/main.js obsidian/aisle4/manifest.json obsidian/aisle4/styles.css "$DEST/"
  echo "Deployed to $DEST"
"""

[tasks.xcode]
description = "Build and run the iOS app in Xcode"
dir = "clients/ios"
run = """
set -e

# Installs as a separate "Groceries Dev" app (distinct bundle ID, Keychain,
# and local data) so this never overwrites or shares auth state with a real
# Groceries install pointed at production.
export TUIST_DEV_BUILD=1

# The physical device can't reach the Mac via `localhost`, so point the Debug
# build at the Mac's LAN IP instead (assumes phone and Mac share a LAN).
LAN_IP=$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || true)
if [ -z "$LAN_IP" ]; then
    echo "Could not determine LAN IP address; falling back to localhost, which will not be reachable from a physical device" >&2
else
    export TUIST_API_BASE_URL="http://$LAN_IP:3000"
    echo "Pointing device build at $TUIST_API_BASE_URL"
fi

tuist generate --no-open

xcodebuild \
    -project Groceries.xcodeproj \
    -scheme Aisle4 \
    -destination 'platform=iOS,id=00008110-000A7D022184801E' \
    -allowProvisioningUpdates \
    -derivedDataPath ./Derived \
    build

xcrun devicectl device install app \
    --device 00008110-000A7D022184801E \
    ./Derived/Build/Products/Debug-iphoneos/Aisle4.app

xcrun devicectl device process launch \
    --device 00008110-000A7D022184801E \
    com.ryannixon.groceries.local
"""
