version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bufbuild/buf-examples/gen
plugins:
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: gen
    opt:
      - paths=source_relative
      - simple
  # connectrpc/swift depends on apple/swift
  - remote: buf.build/apple/swift:v1.38.1
    out: gen
inputs:
  - directory: proto
