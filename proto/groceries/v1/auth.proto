syntax = "proto3";

package groceries.v1;

import "google/protobuf/timestamp.proto";

import "groceries/v1/users.proto";

// Authentication and current user.
service AuthService {
  // Log in and obtain an API token.
  //
  // Validates credentials and, on success, returns a Bearer token to use in
  // subsequent requests. This RPC is exempt from authentication.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Invalidate the current API token.
  //
  // Deletes the token from Redis, rendering it immediately invalid.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Get the currently authenticated user.
  rpc Me(MeRequest) returns (MeResponse);
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  // Bearer token to use in subsequent requests.
  string token = 1;

  // Timestamp when the token expires.
  google.protobuf.Timestamp expires_at = 2;
}
